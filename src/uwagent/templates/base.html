<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}UW queue{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1d232b; }
  header { background: #14213d; color: #fff; padding: 12px 24px; display: flex; gap: 20px; align-items: center; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  main { padding: 20px 24px; max-width: 1100px; }
  .counts span.pill { margin-right: 14px; }
  .card { background: #fff; border: 1px solid #d8dde3; border-radius: 8px; padding: 14px 16px; margin: 12px 0; }
  .card.decline { border-left: 4px solid #c0392b; }
  .card.review { border-left: 4px solid #d4a017; }
  .muted { color: #5b6573; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  td, th { border-bottom: 1px solid #e3e6ea; padding: 6px 8px; text-align: left; font-size: 14px; vertical-align: top; }
  pre { white-space: pre-wrap; background: #f0f2f5; padding: 10px; border-radius: 6px; font-size: 13px; }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid #14213d; background: #fff; cursor: pointer; }
  button.primary { background: #14213d; color: #fff; }
  textarea { width: 100%; min-height: 110px; font-family: inherit; }
  .state { font-weight: 600; font-size: 12px; padding: 2px 6px; border-radius: 4px; background: #e8ecf1; }
</style>
</head>
<body>
<header>
  <a href="/">UW queue</a>
  <form method="post" action="/queue" style="display:flex;gap:6px">
    <input name="seed" placeholder="seed" size="6"><button>Run morning queue</button>
  </form>
  <form method="post" action="/simulate-replies"><button>Simulate broker replies</button></form>
  <a href="http://127.0.0.1:8025/" target="_blank">Mailbox</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
