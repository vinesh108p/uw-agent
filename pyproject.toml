[project]
name = "uwagent"
version = "0.1.0"
description = "Stand UW agentic assistant (PoC)"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.12,<2",
  "fastapi>=0.140",
  "uvicorn>=0.50",
  "httpx>=0.28",
  "jinja2>=3.1",
  "pydantic>=2.10",
  "python-multipart>=0.0.20",
]

[project.scripts]
uwagent = "uwagent.cli:main"

[dependency-groups]
dev = ["pytest>=9", "respx>=0.23", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uwagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
